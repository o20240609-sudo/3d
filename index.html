<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浮空島生態專題 - 3D 互動探索地圖</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { overflow: hidden; background-color: #0b192c; }
        #canvas-container { width: 100vw; height: 100vh; display: block; position: relative; }

        /* 3D 設施上方的漂浮名字提示框 */
        .facility-label {
            background: rgba(15, 23, 42, 0.88);
            border: 1.5px solid #38bdf8;
            color: #38bdf8;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            transition: transform 0.2s, background 0.2s, color 0.2s;
            white-space: nowrap;
            user-select: none;
        }
        .facility-label:hover {
            background: #38bdf8;
            color: #0f172a;
            transform: scale(1.12);
        }
        .facility-label::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 6px 6px 0;
            border-style: solid;
            border-color: #38bdf8 transparent transparent transparent;
        }

        /* 左側控制面板 */
        .ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid #38bdf8;
            border-radius: 12px;
            padding: 20px;
            color: #f8fafc;
            max-width: 310px;
            backdrop-filter: blur(8px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .ui-panel h1 { font-size: 1.25rem; color: #38bdf8; margin-bottom: 8px; }
        .ui-panel p { font-size: 0.85rem; line-height: 1.5; color: #cbd5e1; margin-bottom: 15px; }

        .nav-buttons { display: flex; flex-direction: column; gap: 8px; }
        button {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: #38bdf8;
            border: 1px solid #38bdf8;
            padding: 9px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.88rem;
            text-align: left;
            transition: all 0.25s ease;
        }
        button:hover { background: #38bdf8; color: #0f172a; font-weight: bold; transform: translateX(4px); }

        /* 右下角設施介紹彈出視窗 */
        #info-card {
            position: absolute;
            bottom: 30px;
            right: 30px;
            z-index: 10;
            background: rgba(15, 23, 42, 0.94);
            border: 2px solid #f43f5e;
            border-radius: 12px;
            padding: 22px;
            color: #fff;
            width: 340px;
            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        #info-card h2 { color: #f43f5e; font-size: 1.2rem; margin-bottom: 10px; border-bottom: 1px solid rgba(244, 63, 94, 0.3); padding-bottom: 6px; }
        #info-card p { font-size: 0.92rem; line-height: 1.6; color: #e2e8f0; }
        .close-btn { margin-top: 15px; background: #f43f5e; color: #fff; border: none; text-align: center; width: 100%; font-weight: bold; }
        .close-btn:hover { background: #e11d48; transform: none; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- 左側導覽控制面板 -->
    <div class="ui-panel">
        <h1>🏝️ 浮空島生態專題</h1>
        <p>點擊島上建築上方的「藍色提示框」或下方按鈕，探索各項精細設施：</p>
        <div class="nav-buttons">
            <button onclick="focusFacility(0)">⚓ 飛空艇與海港碼頭（專題簡介）</button>
            <button onclick="focusFacility(1)">🏡 玻璃溫室與市集（商品/作品展示）</button>
            <button onclick="focusFacility(2)">⚙️ 齒輪風車動力坊（技術架構）</button>
            <button onclick="focusFacility(3)">🔭 古典觀星燈塔（聯絡與回饋）</button>
            <button onclick="resetView()" style="border-color: #94a3b8; color: #f1f5f9;">🔭 俯瞰全島與動態海洋</button>
            <button onclick="toggleAtmosphere()" style="border-color: #fbbf24; color: #fbbf24;">🌓 切換日落暖陽 / 奇幻星夜</button>
        </div>
    </div>

    <!-- 右下角資料展示卡 -->
    <div id="info-card">
        <h2 id="card-title">設施名稱</h2>
        <p id="card-desc">設施詳細介紹內容。</p>
        <button class="close-btn" onclick="closeCard()">關閉介紹視窗</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // 1. 場景、相機與渲染器初始化
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x38bdf8);
        scene.fog = new THREE.FogExp2(0x38bdf8, 0.006);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(38, 28, 38);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.getElementById('canvas-container').appendChild(labelRenderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI / 2 - 0.02;
        controls.minDistance = 10;
        controls.maxDistance = 85;

        // 2. 燈光設置
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfffbeb, 1.5);
        sunLight.position.set(30, 50, 20);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 10;
        sunLight.shadow.camera.far = 120;
        const d = 35;
        sunLight.shadow.camera.left = -d;
        sunLight.shadow.camera.right = d;
        sunLight.shadow.camera.top = d;
        sunLight.shadow.camera.bottom = -d;
        scene.add(sunLight);

        // 3. 具有動態波浪的海洋
        const seaGeo = new THREE.PlaneGeometry(450, 450, 45, 45);
        const seaMat = new THREE.MeshStandardMaterial({
            color: 0x0284c7,
            roughness: 0.15,
            metalness: 0.2,
            flatShading: true
        });
        const sea = new THREE.Mesh(seaGeo, seaMat);
        sea.rotation.x = -Math.PI / 2;
        sea.position.y = -5;
        sea.receiveShadow = true;
        scene.add(sea);

        // 4. 起伏山丘與平地的浮空島主體
        const islandGroup = new THREE.Group();
        scene.add(islandGroup);

        const rockMat = new THREE.MeshStandardMaterial({ color: 0x57534e, flatShading: true });
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x22c55e, flatShading: true });
        const woodMat = new THREE.MeshStandardMaterial({ color: 0x854d0e, flatShading: true });
        const stoneMat = new THREE.MeshStandardMaterial({ color: 0xa8a29e, flatShading: true });

        // 島嶼底部懸浮岩盤
        const islandBase = new THREE.Mesh(new THREE.ConeGeometry(22, 10, 10), rockMat);
        islandBase.rotation.x = Math.PI;
        islandBase.position.y = -3.5;
        islandBase.castShadow = true;
        islandBase.receiveShadow = true;
        islandGroup.add(islandBase);

        // 主平地與山丘群
        const mainGround = new THREE.Mesh(new THREE.BoxGeometry(28, 1.8, 28), groundMat);
        mainGround.position.y = 1.0;
        mainGround.receiveShadow = true;
        islandGroup.add(mainGround);

        // 後方與側邊起伏山丘
        const hill1 = new THREE.Mesh(new THREE.DodecahedronGeometry(8, 1), groundMat);
        hill1.position.set(-7, 3.5, -6);
        hill1.scale.set(1.4, 0.7, 1.4);
        islandGroup.add(hill1);

        const hill2 = new THREE.Mesh(new THREE.DodecahedronGeometry(6.5, 1), groundMat);
        hill2.position.set(8, 2.8, 7);
        hill2.scale.set(1.5, 0.6, 1.3);
        islandGroup.add(hill2);

        // 5. 設施設定與精細 3D 模型建立
        const facilitiesData = [
            { label: "⚓ 飛空艇與海港碼頭", title: "⚓ 飛空艇與海港碼頭（專題簡介）", desc: "冒險的起點！此區展示本專題的核心理念、開發背景、核心目標與團隊成員介紹。", pos: new THREE.Vector3(-9, 1.9, 9) },
            { label: "🏡 玻璃溫室與市集", title: "🏡 玻璃溫室與市集（商品與作品展示）", desc: "島上的貿易與展售中心。對應網站的動態資料展示區，支援多條件篩選、詳細卡片與互動操作。", pos: new THREE.Vector3(4, 1.9, 5) },
            { label: "⚙️ 齒輪風車動力坊", title: "⚙️ 齒輪風車動力坊（系統技術架構）", desc: "為全島提供動力的機械重鎮。完整解析網站的前端框架、WebGL 3D 互動渲染邏輯與後端資料庫串接架構。", pos: new THREE.Vector3(-7, 5.5, -6) },
            { label: "🔭 古典觀星燈塔", title: "🔭 古典觀星燈塔（聯絡與回饋）", desc: "佇立於最高山巔的指引之塔。歡迎在此填寫互動留言表單、給予專題建議或前往 GitHub 檢視完整原始碼。", pos: new THREE.Vector3(8, 4.6, 7) }
        ];

        const facilityTargets = [];

        function attachLabel(parentMesh, text, index, yOffset) {
            const div = document.createElement('div');
            div.className = 'facility-label';
            div.textContent = text;
            div.addEventListener('click', (e) => {
                e.stopPropagation();
                focusFacility(index);
            });
            const label = new CSS2DObject(div);
            label.position.set(0, yOffset, 0);
            parentMesh.add(label);
        }

        // [設施 1] 飛空艇與海港碼頭
        const dockGroup = new THREE.Group();
        dockGroup.position.copy(facilitiesData[0].pos);
        const pier = new THREE.Mesh(new THREE.BoxGeometry(4, 0.4, 6), woodMat);
        // 飛空艇本體
        const airship = new THREE.Group();
        airship.position.set(0, 3.2, 0);
        const balloon = new THREE.Mesh(new THREE.CapsuleGeometry(1.2, 3.2, 8, 16), new THREE.MeshStandardMaterial({ color: 0xef4444, flatShading: true }));
        balloon.rotation.z = Math.PI / 2;
        const cabin = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.7, 1.6), woodMat);
        cabin.position.y = -1.5;
        airship.add(balloon, cabin);
        dockGroup.add(pier, airship);
        islandGroup.add(dockGroup);
        attachLabel(dockGroup, facilitiesData[0].label, 0, 4.2);
        facilityTargets.push(dockGroup);

        // [設施 2] 玻璃溫室與市集
        const marketGroup = new THREE.Group();
        marketGroup.position.copy(facilitiesData[1].pos);
        const greenhouseBase = new THREE.Mesh(new THREE.BoxGeometry(4.5, 2.2, 3.5), stoneMat);
        const glassRoof = new THREE.Mesh(new THREE.ConeGeometry(3.2, 1.8, 4), new THREE.MeshStandardMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.65, roughness: 0.1 }));
        glassRoof.position.y = 2.0;
        glassRoof.rotation.y = Math.PI / 4;
        marketGroup.add(greenhouseBase, glassRoof);
        islandGroup.add(marketGroup);
        attachLabel(marketGroup, facilitiesData[1].label, 1, 3.5);
        facilityTargets.push(marketGroup);

        // [設施 3] 齒輪風車動力坊
        const millGroup = new THREE.Group();
        millGroup.position.copy(facilitiesData[2].pos);
        const tower = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.6, 3.5, 8), stoneMat);
        tower.position.y = 1.75;
        // 風車葉片群
        const bladesGroup = new THREE.Group();
        bladesGroup.position.set(0, 2.8, 1.3);
        for (let i = 0; i < 4; i++) {
            const blade = new THREE.Mesh(new THREE.BoxGeometry(0.3, 2.4, 0.1), woodMat);
            blade.rotation.z = (i * Math.PI) / 2;
            bladesGroup.add(blade);
        }
        millGroup.add(tower, bladesGroup);
        islandGroup.add(millGroup);
        attachLabel(millGroup, facilitiesData[2].label, 2, 4.2);
        facilityTargets.push(millGroup);
        millGroup.userData = { rotatingBlades: bladesGroup };

        // [設施 4] 古典觀星燈塔
        const lighthouseGroup = new THREE.Group();
        lighthouseGroup.position.copy(facilitiesData[3].pos);
        const lhTower = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 1.3, 4.5, 10), new THREE.MeshStandardMaterial({ color: 0xf8fafc, flatShading: true }));
        lhTower.position.y = 2.25;
        const lhTop = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.1, 1.2, 10), new THREE.MeshStandardMaterial({ color: 0x1e293b }));
        lhTop.position.y = 4.8;
        const beacon = new THREE.Mesh(new THREE.SphereGeometry(0.5, 12, 12), new THREE.MeshStandardMaterial({ color: 0xfbbf24, emissive: 0xf59e0b }));
        beacon.position.y = 5.6;
        lighthouseGroup.add(lhTower, lhTop, beacon);
        islandGroup.add(lighthouseGroup);
        attachLabel(lighthouseGroup, facilitiesData[3].label, 3, 6.5);
        facilityTargets.push(lighthouseGroup);
        lighthouseGroup.userData = { beaconMesh: beacon };

        // 6. 島上居民與動態生態
        const citizens = [];
        const outfitColors = [0x38bdf8, 0xf43f5e, 0x10b981, 0xfbbf24, 0xa855f7];

        function createNPC(color) {
            const npc = new THREE.Group();
            const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.18, 0.5, 4, 8), new THREE.MeshStandardMaterial({ color }));
            body.position.y = 0.45;
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.16, 8, 8), new THREE.MeshStandardMaterial({ color: 0xfde047 }));
            head.position.y = 0.85;
            npc.add(body, head);
            npc.castShadow = true;
            return npc;
        }

        // 巡邏村民
        const npcPaths = [
            { start: new THREE.Vector3(-6, 1.9, 6), end: new THREE.Vector3(2, 1.9, 2), speed: 0.8 },
            { start: new THREE.Vector3(-3, 1.9, -3), end: new THREE.Vector3(5, 1.9, -5), speed: 0.6 }
        ];

        npcPaths.forEach((pathInfo, idx) => {
            const npc = createNPC(outfitColors[idx % outfitColors.length]);
            islandGroup.add(npc);
            citizens.push({ mesh: npc, ...pathInfo, progress: Math.random() });
        });

        // 7. 精細海洋生物：擬真海豚與會擺尾噴水的巨型鯨魚
        // 海豚
        const dolphin = new THREE.Group();
        const dBody = new THREE.Mesh(new THREE.ConeGeometry(0.4, 2.4, 8), new THREE.MeshStandardMaterial({ color: 0x0284c7, flatShading: true }));
        dBody.rotation.x = Math.PI / 2;
        const dFin = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.6, 4), new THREE.MeshStandardMaterial({ color: 0x0369a1 }));
        dFin.position.set(0, 0.3, 0);
        dolphin.add(dBody, dFin);
        scene.add(dolphin);

        // 巨型鯨魚
        const whale = new THREE.Group();
        const wBody = new THREE.Mesh(new THREE.BoxGeometry(2.4, 1.8, 6), new THREE.MeshStandardMaterial({ color: 0x1e293b, flatShading: true }));
        const wTail = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.3, 1.4), new THREE.MeshStandardMaterial({ color: 0x1e293b }));
        wTail.position.set(0, 0.2, -3.5);
        whale.add(wBody, wTail);
        whale.position.set(-25, -4.2, 12);
        scene.add(whale);

        // 鯨魚噴水粒子
        const spoutParticles = [];
        const spoutMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 });
        for (let i = 0; i < 20; i++) {
            const drop = new THREE.Mesh(new THREE.SphereGeometry(0.15, 6, 6), spoutMat);
            drop.visible = false;
            whale.add(drop);
            spoutParticles.push({
                mesh: drop,
                vx: (Math.random() - 0.5) * 0.09,
                vy: 0.18 + Math.random() * 0.1,
                vz: (Math.random() - 0.5) * 0.09,
                life: 0
            });
        }

        // 8. 相機運鏡與互動控制
        let targetCamPos = new THREE.Vector3(38, 28, 38);
        let targetLookAt = new THREE.Vector3(0, 3, 0);
        let isAnimating = false;

        window.focusFacility = (index) => {
            const targetPos = facilitiesData[index].pos;
            targetLookAt.copy(targetPos);
            targetCamPos.set(targetPos.x + 7, targetPos.y + 4.5, targetPos.z + 8);
            isAnimating = true;

            document.getElementById('card-title').innerText = facilitiesData[index].title;
            document.getElementById('card-desc').innerText = facilitiesData[index].desc;
            document.getElementById('info-card').style.display = 'block';
        };

        window.resetView = () => {
            targetCamPos.set(38, 28, 38);
            targetLookAt.set(0, 3, 0);
            isAnimating = true;
            closeCard();
        };

        window.closeCard = () => {
            document.getElementById('info-card').style.display = 'none';
        };

        let isNight = false;
        window.toggleAtmosphere = () => {
            isNight = !isNight;
            if (isNight) {
                scene.background = new THREE.Color(0x0f172a);
                scene.fog.color = new THREE.Color(0x0f172a);
                sunLight.intensity = 0.2;
                ambientLight.intensity = 0.3;
                seaMat.color = new THREE.Color(0x090d16);
            } else {
                scene.background = new THREE.Color(0x38bdf8);
                scene.fog.color = new THREE.Color(0x38bdf8);
                sunLight.intensity = 1.5;
                ambientLight.intensity = 0.65;
                seaMat.color = new THREE.Color(0x0284c7);
            }
        };

        // 9. 動畫迴圈
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const elapsed = clock.getElapsedTime();

            // 島嶼微幅浮空起伏
            islandGroup.position.y = Math.sin(elapsed * 1.2) * 0.2;

            // 海洋波浪頂點動畫
            const posAttr = seaGeo.attributes.position;
            for (let i = 0; i < posAttr.count; i++) {
                const u = posAttr.getX(i);
                const v = posAttr.getY(i);
                const z = Math.sin(u * 0.15 + elapsed * 2) * Math.cos(v * 0.15 + elapsed * 2) * 0.35;
                posAttr.setZ(i, z);
            }
            posAttr.needsUpdate = true;

            // 設施機械運轉
            if (millGroup.userData.rotatingBlades) {
                millGroup.userData.rotatingBlades.rotation.z -= 0.025;
            }
            if (lighthouseGroup.userData.beaconMesh) {
                lighthouseGroup.userData.beaconMesh.position.x = Math.sin(elapsed * 3) * 0.3;
            }

            // NPC 巡邏移動
            citizens.forEach(c => {
                c.progress += 0.003 * c.speed;
                if (c.progress > 1) c.progress = 0;
                c.mesh.position.lerpVectors(c.start, c.end, Math.sin(c.progress * Math.PI * 2) * 0.5 + 0.5);
                c.mesh.position.y = c.start.y + Math.abs(Math.sin(elapsed * 12)) * 0.08;
            });

            // 海豚躍出水面
            const dCycle = elapsed % 6.5;
            if (dCycle < 2.2) {
                const t = dCycle / 2.2;
                dolphin.position.set(-16 + t * 14, -4.8 + Math.sin(t * Math.PI) * 4.2, -8);
                dolphin.rotation.z = (0.5 - t) * 1.6;
                dolphin.rotation.y = -Math.PI / 4;
                dolphin.visible = true;
            } else {
                dolphin.visible = false;
            }

            // 鯨魚巡游與尾鰭擺動、定期噴水
            const wAngle = elapsed * 0.1;
            whale.position.x = Math.cos(wAngle) * 30;
            whale.position.z = Math.sin(wAngle) * 30;
            whale.rotation.y = -wAngle - Math.PI / 2;
            wTail.rotation.x = Math.sin(elapsed * 5) * 0.2; // 尾鰭上下擺動

            const sCycle = elapsed % 7;
            const spouting = sCycle < 2.5;
            spoutParticles.forEach((p, idx) => {
                if (spouting) {
                    if (!p.mesh.visible || p.life > 1.0) {
                        p.mesh.visible = true;
                        p.mesh.position.set(0, 1.1, -1.5);
                        p.life = (idx / spoutParticles.length) * 0.4;
                    }
                    p.mesh.position.x += p.vx;
                    p.mesh.position.y += p.vy;
                    p.mesh.position.z += p.vz;
                    p.vy -= 0.005;
                    p.life += 0.02;
                    if (p.mesh.position.y < 0.5) {
                        p.vy = 0.18 + Math.random() * 0.1;
                        p.mesh.position.set(0, 1.1, -1.5);
                    }
                } else {
                    p.mesh.visible = false;
                }
            });

            // 平滑相機運鏡
            if (isAnimating) {
                camera.position.lerp(targetCamPos, 0.06);
                controls.target.lerp(targetLookAt, 0.06);
                if (camera.position.distanceTo(targetCamPos) < 0.15) isAnimating = false;
            }

            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
