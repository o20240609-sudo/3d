<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>巴比倫空中花園 - 3D 生態互動專題地圖</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { overflow: hidden; background-color: #1a1a2e; }
        #canvas-container { width: 100vw; height: 100vh; display: block; position: relative; }

        /* 3D 設施上方的漂浮名字提示框 */
        .facility-label {
            background: rgba(28, 20, 13, 0.88);
            border: 1.5px solid #ffd700;
            color: #ffd700;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            transition: transform 0.2s, background 0.2s, color 0.2s;
            white-space: nowrap;
            user-select: none;
        }
        .facility-label:hover {
            background: #ffd700;
            color: #1c140d;
            transform: scale(1.12);
        }
        .facility-label::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 6px 6px 0;
            border-style: solid;
            border-color: #ffd700 transparent transparent transparent;
        }

        /* 左側控制面板 */
        .ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(38, 28, 20, 0.85);
            border: 2px solid #d4af37;
            border-radius: 10px;
            padding: 20px;
            color: #f4e8d1;
            max-width: 300px;
            backdrop-filter: blur(5px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        .ui-panel h1 { font-size: 1.3rem; color: #ffd700; margin-bottom: 8px; }
        .ui-panel p { font-size: 0.85rem; line-height: 1.5; color: #dcd0c0; margin-bottom: 15px; }

        .nav-buttons { display: flex; flex-direction: column; gap: 8px; }
        button {
            background: linear-gradient(135deg, #5c4328, #3d2b18);
            color: #ffd700;
            border: 1px solid #d4af37;
            padding: 9px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.88rem;
            text-align: left;
            transition: all 0.25s ease;
        }
        button:hover { background: #d4af37; color: #261c14; font-weight: bold; transform: translateX(4px); }

        /* 右下角設施介紹彈出視窗 */
        #info-card {
            position: absolute;
            bottom: 30px;
            right: 30px;
            z-index: 10;
            background: rgba(32, 23, 16, 0.94);
            border: 2px solid #4ecdc4;
            border-radius: 12px;
            padding: 22px;
            color: #fff;
            width: 340px;
            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        #info-card h2 { color: #4ecdc4; font-size: 1.2rem; margin-bottom: 10px; border-bottom: 1px solid rgba(78, 205, 196, 0.3); padding-bottom: 6px; }
        #info-card p { font-size: 0.92rem; line-height: 1.6; color: #e8e8e8; }
        .close-btn { margin-top: 15px; background: #4ecdc4; color: #1a1a2e; border: none; text-align: center; width: 100%; font-weight: bold; }
        .close-btn:hover { background: #3bb8b0; transform: none; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- 左側導覽控制面板 -->
    <div class="ui-panel">
        <h1>🏛️ 巴比倫空中花園</h1>
        <p>直接點擊建築上方的「金色提示框」或下方按鈕，探索各層設施與島嶼生態：</p>
        <div class="nav-buttons">
            <button onclick="focusFacility(0)">1F 古代灌溉水車（專題簡介）</button>
            <button onclick="focusFacility(1)">2F 巴比倫繁華市集（商品展示）</button>
            <button onclick="focusFacility(2)">3F 大圖書館星象儀（技術架構）</button>
            <button onclick="focusFacility(3)">4F 頂層空中神殿（聯絡我們）</button>
            <button onclick="resetView()" style="border-color: #aaa; color: #eee;">🔭 俯瞰全島與海洋生態</button>
            <button onclick="toggleAtmosphere()" style="border-color: #4ecdc4; color: #4ecdc4;">🌓 切換白晝暖陽 / 星夜模式</button>
        </div>
    </div>

    <!-- 右下角資料展示卡 -->
    <div id="info-card">
        <h2 id="card-title">設施名稱</h2>
        <p id="card-desc">設施詳細介紹內容。</p>
        <button class="close-btn" onclick="closeCard()">關閉介紹視窗</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // 1. 場景與渲染器初始化
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.008);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(36, 26, 36);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // 初始化 2D 標籤渲染器 (用於顯示設施名字提示框)
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.getElementById('canvas-container').appendChild(labelRenderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI / 2 - 0.03;
        controls.minDistance = 10;
        controls.maxDistance = 80;

        // 2. 光源設置
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfff5e4, 1.6);
        sunLight.position.set(25, 45, 25);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        scene.add(sunLight);

        // 3. 廣闊海洋場景
        const seaGeo = new THREE.PlaneGeometry(400, 400, 32, 32);
        const seaMat = new THREE.MeshStandardMaterial({
            color: 0x0077be,
            roughness: 0.2,
            metalness: 0.3,
            flatShading: true
        });
        const sea = new THREE.Mesh(seaGeo, seaMat);
        sea.rotation.x = -Math.PI / 2;
        sea.position.y = -4;
        sea.receiveShadow = true;
        scene.add(sea);

        // 4. 放大版巴比倫空中花園主體
        const islandGroup = new THREE.Group();
        scene.add(islandGroup);

        const stoneMat = new THREE.MeshStandardMaterial({ color: 0xd9a773, flatShading: true });
        const grassMat = new THREE.MeshStandardMaterial({ color: 0x4ca64c, flatShading: true });
        const woodMat = new THREE.MeshStandardMaterial({ color: 0x7a4928, flatShading: true });
        const goldMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.7, roughness: 0.2 });
        const waterMat = new THREE.MeshStandardMaterial({ color: 0x38b6ff, emissive: 0x004466 });

        // 島嶼底部岩盤 (懸浮於海面上方)
        const rockBase = new THREE.Mesh(new THREE.ConeGeometry(18, 8, 9), new THREE.MeshStandardMaterial({ color: 0x6b533e, flatShading: true }));
        rockBase.rotation.x = Math.PI;
        rockBase.position.y = -2.5;
        islandGroup.add(rockBase);

        // 四層露台規格 (放大尺寸)
        const levelsConfig = [
            { y: 1.5, size: 22, label: "⚙️ 1F 古代灌溉水車", title: "1F 古代灌溉水車（專題簡介）", desc: "利用阿基米德螺旋原理將下方海水抽上空中花園。此區展示本專題的核心設計理念、開發背景與團隊成員介紹。" },
            { y: 4.5, size: 16.5, label: "⛺ 2F 巴比倫繁華市集", title: "2F 巴比倫繁華市集（核心商品展示）", desc: "島上最熱鬧的交易中心，人民在此買賣香料與陶器。對應網站的動態商品展示區，支援分類篩選與購物車功能。" },
            { y: 7.5, size: 11.5, label: "🔭 3F 大圖書館星象儀", title: "3F 大圖書館星象儀（系統技術架構）", desc: "學者觀測星象與記錄泥板文獻的聖地。此區完整解析網站使用的前端 3D WebGL 渲染技術、後端邏輯與資料庫設計。" },
            { y: 10.5, size: 6.5, label: "🏛️ 4F 頂層空中神殿", title: "4F 頂層空中神殿（聯絡與許願池）", desc: "花園最高處的黃金聖殿，象徵智慧與願望的傳遞。歡迎在此填寫留言表單、給予專題回饋或前往 GitHub 檢視原始碼。" }
        ];

        const facilityTargets = [];

        levelsConfig.forEach((lvl, idx) => {
            // 石造露台
            const tier = new THREE.Mesh(new THREE.BoxGeometry(lvl.size, 2.6, lvl.size), stoneMat);
            tier.position.y = lvl.y;
            tier.castShadow = true;
            tier.receiveShadow = true;
            islandGroup.add(tier);

            // 綠意草皮
            const grass = new THREE.Mesh(new THREE.BoxGeometry(lvl.size + 0.4, 0.35, lvl.size + 0.4), grassMat);
            grass.position.y = lvl.y + 1.45;
            grass.receiveShadow = true;
            islandGroup.add(grass);

            // 露台角落石柱與垂吊藤蔓
            const offset = lvl.size / 2 - 0.6;
            [[-offset, -offset], [offset, -offset], [-offset, offset], [offset, offset]].forEach(([px, pz]) => {
                const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.35, 1.8, 8), stoneMat);
                pillar.position.set(px, lvl.y + 2.4, pz);
                islandGroup.add(pillar);

                const vine = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.4, 0.5), grassMat);
                vine.position.set(px, lvl.y + 0.6, pz);
                islandGroup.add(vine);
            });
        });

        // 5. 為每一層打造專屬立體設施與名字提示框
        function attachLabel(mesh, text, index, yOffset) {
            const div = document.createElement('div');
            div.className = 'facility-label';
            div.textContent = text;
            div.addEventListener('click', (e) => {
                e.stopPropagation();
                focusFacility(index);
            });
            const label = new CSS2DObject(div);
            label.position.set(0, yOffset, 0);
            mesh.add(label);
        }

        // [1F 設施] 巨型古代水車 (位於第一層前方偏右)
        const waterwheelGroup = new THREE.Group();
        waterwheelGroup.position.set(6, 3.8, 8.5);
        const wheelRing = new THREE.Mesh(new THREE.TorusGeometry(1.8, 0.25, 8, 16), woodMat);
        waterwheelGroup.add(wheelRing);
        for (let i = 0; i < 6; i++) {
            const spoke = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.2, 0.2), woodMat);
            spoke.rotation.z = (i * Math.PI) / 6;
            waterwheelGroup.add(spoke);
        }
        islandGroup.add(waterwheelGroup);
        attachLabel(waterwheelGroup, levelsConfig[0].label, 0, 2.6);
        facilityTargets.push(waterwheelGroup);

        // [2F 設施] 巴比倫市集帳篷攤位 (位於第二層左前方)
        const marketGroup = new THREE.Group();
        marketGroup.position.set(-5, 6.2, 5.5);
        const stallBase = new THREE.Mesh(new THREE.BoxGeometry(3.2, 1, 2.2), woodMat);
        const tentRoof = new THREE.Mesh(new THREE.ConeGeometry(2.5, 1.5, 4), new THREE.MeshStandardMaterial({ color: 0xd94e34, flatShading: true }));
        tentRoof.position.y = 1.6;
        tentRoof.rotation.y = Math.PI / 4;
        marketGroup.add(stallBase, tentRoof);
        islandGroup.add(marketGroup);
        attachLabel(marketGroup, levelsConfig[1].label, 1, 2.8);
        facilityTargets.push(marketGroup);

        // [3F 設施] 大圖書館黃金星象儀 (位於第三層右側)
        const astrolabeGroup = new THREE.Group();
        astrolabeGroup.position.set(3.2, 10.2, 3.2);
        const ring1 = new THREE.Mesh(new THREE.TorusGeometry(1.3, 0.12, 8, 24), goldMat);
        const ring2 = new THREE.Mesh(new THREE.TorusGeometry(1.0, 0.12, 8, 24), goldMat);
        ring2.rotation.x = Math.PI / 3;
        const coreSphere = new THREE.Mesh(new THREE.SphereGeometry(0.4, 12, 12), new THREE.MeshStandardMaterial({ color: 0x4ecdc4, emissive: 0x1a6b66 }));
        astrolabeGroup.add(ring1, ring2, coreSphere);
        islandGroup.add(astrolabeGroup);
        attachLabel(astrolabeGroup, levelsConfig[2].label, 2, 2.1);
        facilityTargets.push(astrolabeGroup);

        // [4F 設施] 頂層空中神殿 (位於第四層正中央)
        const templeGroup = new THREE.Group();
        templeGroup.position.set(0, 12.2, 0);
        const templeRoof = new THREE.Mesh(new THREE.ConeGeometry(2.8, 1.6, 4), goldMat);
        templeRoof.position.y = 2.0;
        templeRoof.rotation.y = Math.PI / 4;
        const crystal = new THREE.Mesh(new THREE.OctahedronGeometry(0.7, 0), new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0xaa6600 }));
        crystal.position.y = 0.8;
        templeGroup.add(templeRoof, crystal);
        // 神殿四根柱子
        [[-1.4, -1.4], [1.4, -1.4], [-1.4, 1.4], [1.4, 1.4]].forEach(([cx, cz]) => {
            const col = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 1.6, 8), stoneMat);
            col.position.set(cx, 0.6, cz);
            templeGroup.add(col);
        });
        islandGroup.add(templeGroup);
        attachLabel(templeGroup, levelsConfig[3].label, 3, 3.3);
        facilityTargets.push(templeGroup);

        // 從頂層流向大海的瀑布
        const waterfall = new THREE.Mesh(new THREE.BoxGeometry(1.6, 17, 0.5), waterMat);
        waterfall.position.set(0, 4.5, 11.2);
        islandGroup.add(waterfall);

        // 6. 建立島上立體人民（走路巡邏 & 定點工作）
        const citizens = [];
        const robeColors = [0xe63946, 0xf4a261, 0x2a9d8f, 0xe9c46a, 0x9b5de5, 0xffffff];

        function createCitizen(color) {
            const person = new THREE.Group();
            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.28, 0.75, 6), new THREE.MeshStandardMaterial({ color }));
            body.position.y = 0.375;
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.18, 8, 8), new THREE.MeshStandardMaterial({ color: 0xffcdb2 }));
            head.position.y = 0.9;
            person.add(body, head);
            person.castShadow = true;
            return person;
        }

        // 沿著各層露台走動的人民
        const walkersConfig = [
            { y: 2.95, radius: 9.2, speed: 0.4, angle: 0 },
            { y: 2.95, radius: 9.2, speed: -0.35, angle: 2.5 },
            { y: 5.95, radius: 6.8, speed: 0.45, angle: 1.0 },
            { y: 5.95, radius: 6.8, speed: 0.45, angle: 4.2 },
            { y: 8.95, radius: 4.5, speed: -0.5, angle: 0.5 }
        ];

        walkersConfig.forEach((cfg, i) => {
            const p = createCitizen(robeColors[i % robeColors.length]);
            islandGroup.add(p);
            citizens.push({ mesh: p, type: 'walk', ...cfg });
        });

        // 在設施旁忙碌工作的人民 (市集攤販、水車工匠、神殿祭司)
        const workersConfig = [
            { x: -3.5, y: 5.95, z: 5.5, phase: 0 },   // 市集老闆
            { x: 4.5, y: 2.95, z: 8.5, phase: 1.5 },  // 水車工匠
            { x: 1.8, y: 8.95, z: 3.2, phase: 3.0 },  // 圖書館學者
            { x: 0, y: 11.95, z: 2.2, phase: 4.5 }    // 神殿祭司
        ];

        workersConfig.forEach((cfg, i) => {
            const p = createCitizen(robeColors[(i + 2) % robeColors.length]);
            p.position.set(cfg.x, cfg.y, cfg.z);
            islandGroup.add(p);
            citizens.push({ mesh: p, type: 'work', baseY: cfg.y, phase: cfg.phase });
        });

        // 7. 海洋生物：海豚躍出水面 & 鯨魚游動噴水
        // 建立海豚
        const dolphin = new THREE.Group();
        const dolphinBody = new THREE.Mesh(new THREE.ConeGeometry(0.45, 2.2, 8), new THREE.MeshStandardMaterial({ color: 0x5c9ead, flatShading: true }));
        dolphinBody.rotation.x = Math.PI / 2;
        const dolphinFin = new THREE.Mesh(new THREE.ConeGeometry(0.25, 0.7, 4), new THREE.MeshStandardMaterial({ color: 0x326273 }));
        dolphinFin.position.set(0, 0.35, 0);
        dolphin.add(dolphinBody, dolphinFin);
        scene.add(dolphin);

        // 建立鯨魚與噴水粒子
        const whale = new THREE.Group();
        const whaleBody = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1.6, 5.2), new THREE.MeshStandardMaterial({ color: 0x2b4162, flatShading: true }));
        const whaleTail = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.3, 1.2), new THREE.MeshStandardMaterial({ color: 0x2b4162 }));
        whaleTail.position.set(0, 0.2, -3.0);
        whale.add(whaleBody, whaleTail);
        whale.position.set(-22, -4.1, 10);
        scene.add(whale);

        // 鯨魚噴水粒子群
        const spoutParticles = [];
        const spoutMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 });
        for (let i = 0; i < 18; i++) {
            const drop = new THREE.Mesh(new THREE.SphereGeometry(0.18, 6, 6), spoutMat);
            drop.visible = false;
            whale.add(drop);
            spoutParticles.push({
                mesh: drop,
                vx: (Math.random() - 0.5) * 0.08,
                vy: 0.15 + Math.random() * 0.12,
                vz: (Math.random() - 0.5) * 0.08,
                life: 0
            });
        }

        // 8. 相機運鏡與互動控制
        let targetCamPos = new THREE.Vector3(36, 26, 36);
        let targetLookAt = new THREE.Vector3(0, 6, 0);
        let isAnimating = false;

        window.focusFacility = (index) => {
            const targetMesh = facilityTargets[index];
            const worldPos = new THREE.Vector3();
            targetMesh.getWorldPosition(worldPos);

            targetLookAt.copy(worldPos);
            targetCamPos.set(worldPos.x + 8, worldPos.y + 4.5, worldPos.z + 9);
            isAnimating = true;

            document.getElementById('card-title').innerText = levelsConfig[index].title;
            document.getElementById('card-desc').innerText = levelsConfig[index].desc;
            document.getElementById('info-card').style.display = 'block';
        };

        window.resetView = () => {
            targetCamPos.set(36, 26, 36);
            targetLookAt.set(0, 6, 0);
            isAnimating = true;
            closeCard();
        };

        window.closeCard = () => {
            document.getElementById('info-card').style.display = 'none';
        };

        let isNight = false;
        window.toggleAtmosphere = () => {
            isNight = !isNight;
            if (isNight) {
                scene.background = new THREE.Color(0x0b132b);
                scene.fog.color = new THREE.Color(0x0b132b);
                sunLight.intensity = 0.25;
                ambientLight.intensity = 0.35;
                seaMat.color = new THREE.Color(0x002b49);
            } else {
                scene.background = new THREE.Color(0x87ceeb);
                scene.fog.color = new THREE.Color(0x87ceeb);
                sunLight.intensity = 1.6;
                ambientLight.intensity = 0.7;
                seaMat.color = new THREE.Color(0x0077be);
            }
        };

        // 9. 主動畫迴圈
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const elapsed = clock.getElapsedTime();

            // 島嶼微幅懸浮與設施機械運轉
            islandGroup.position.y = Math.sin(elapsed * 1.1) * 0.25;
            waterwheelGroup.rotation.z = -elapsed * 1.2;
            ring1.rotation.y = elapsed * 0.9;
            ring2.rotation.z = elapsed * 1.3;
            crystal.rotation.y = elapsed * 1.5;
            crystal.position.y = 0.8 + Math.sin(elapsed * 2.5) * 0.15;

            // 人民走路與工作動態
            citizens.forEach(c => {
                if (c.type === 'walk') {
                    c.angle += c.speed * 0.015;
                    // 沿著方形露台邊緣行走 (使用平滑方圓軌跡)
                    const cos = Math.cos(c.angle);
                    const sin = Math.sin(c.angle);
                    c.mesh.position.x = Math.sign(cos) * Math.pow(Math.abs(cos), 0.5) * c.radius;
                    c.mesh.position.z = Math.sign(sin) * Math.pow(Math.abs(sin), 0.5) * c.radius;
                    c.mesh.position.y = c.y + Math.abs(Math.sin(elapsed * 10)) * 0.08; // 走路小碎步彈跳
                    c.mesh.rotation.y = -c.angle;
                } else if (c.type === 'work') {
                    // 工作者上下律動與左右轉身忙碌
                    c.mesh.position.y = c.baseY + Math.abs(Math.sin(elapsed * 6 + c.phase)) * 0.12;
                    c.mesh.rotation.y = Math.sin(elapsed * 2 + c.phase) * 0.8;
                }
            });

            // 海豚躍出水面週期動畫 (每 6 秒一次完整躍出)
            const dolphinCycle = elapsed % 6;
            if (dolphinCycle < 2.2) {
                const t = dolphinCycle / 2.2; // 0 -> 1
                const jumpX = 16 + t * 10;
                const jumpY = -5.2 + Math.sin(t * Math.PI) * 4.5; // 拋物線高度
                dolphin.position.set(jumpX, jumpY, 14);
                dolphin.rotation.z = (0.5 - t) * 1.8; // 俯仰角隨拋物線變化
                dolphin.rotation.y = Math.PI / 2;
                dolphin.visible = true;
            } else {
                dolphin.visible = false;
            }

            // 鯨魚繞島巡游與定期噴水
            const whaleAngle = elapsed * 0.12;
            whale.position.x = Math.cos(whaleAngle) * 26;
            whale.position.z = Math.sin(whaleAngle) * 26;
            whale.rotation.y = -whaleAngle;

            // 每 7 秒噴水一次，持續 2.5 秒
            const spoutCycle = elapsed % 7;
            const isSpouting = spoutCycle < 2.5;
            spoutParticles.forEach((p, idx) => {
                if (isSpouting) {
                    if (!p.mesh.visible || p.life > 1.0) {
                        p.mesh.visible = true;
                        p.mesh.position.set(0, 0.9, 1.5);
                        p.life = (idx / spoutParticles.length) * 0.5;
                    }
                    p.mesh.position.x += p.vx;
                    p.mesh.position.y += p.vy;
                    p.mesh.position.z += p.vz;
                    p.vy -= 0.006; // 重力下墜
                    p.life += 0.025;
                    if (p.mesh.position.y < 0.5) {
                        p.vy = 0.15 + Math.random() * 0.1;
                        p.mesh.position.set(0, 0.9, 1.5);
                    }
                } else {
                    p.mesh.visible = false;
                }
            });

            // 平滑運鏡插值
            if (isAnimating) {
                camera.position.lerp(targetCamPos, 0.06);
                controls.target.lerp(targetLookAt, 0.06);
                if (camera.position.distanceTo(targetCamPos) < 0.15) isAnimating = false;
            }

            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
